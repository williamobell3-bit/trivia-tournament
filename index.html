<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Tournament - Online</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom right, #020617, #3b0764, #020617); color: white; min-height: 100vh; }
    .container { max-width: 56rem; margin: 0 auto; padding: 2rem; }
    .container-sm { max-width: 28rem; margin: 0 auto; padding: 2rem; }
    .container-lg { max-width: 72rem; margin: 0 auto; padding: 2rem; }
    .card { background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(168, 85, 247, 0.5); border-radius: 1rem; padding: 2rem; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    .title { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: -0.05em; }
    .glow { text-shadow: 0 0 20px rgba(168, 85, 247, 0.5), 0 0 40px rgba(168, 85, 247, 0.3); }
    button { border: none; cursor: pointer; color: white; padding: 1rem 2rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.3s; font-size: 1rem; font-family: inherit; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(168, 85, 247, 0.4); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-purple { background: linear-gradient(to right, #9333ea, #6b21a8); border: 2px solid rgba(168, 85, 247, 0.5); }
    .btn-blue { background: linear-gradient(to right, #2563eb, #1e40af); border: 2px solid rgba(59, 130, 246, 0.5); }
    .btn-green { background: linear-gradient(to right, #16a34a, #065f46); border: 2px solid rgba(34, 197, 94, 0.5); }
    input { width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(168, 85, 247, 0.3); border-radius: 0.5rem; color: white; font-size: 1rem; outline: none; font-family: inherit; }
    input::placeholder { color: rgba(255, 255, 255, 0.5); }
    input:focus { border-color: rgba(168, 85, 247, 0.8); box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .text-center { text-align: center; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mb-12 { margin-bottom: 3rem; }
    .mt-6 { margin-top: 1.5rem; }
    .icon-lg { width: 6rem; height: 6rem; margin: 0 auto 1.5rem; color: #c084fc; }
    .icon-md { width: 4rem; height: 4rem; margin: 0 auto 1rem; }
    .icon-sm { width: 1.5rem; height: 1.5rem; display: inline-block; margin-right: 0.5rem; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .slide-up { animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes countdown { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    .countdown-num { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10rem; z-index: 100; animation: countdown 1s ease-out; }
    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 99; }
    .powerup-icon { font-size: 2rem; padding: 0.5rem; background: rgba(88, 28, 135, 0.3); border: 2px solid rgba(168, 85, 247, 0.5); border-radius: 0.5rem; display: inline-block; margin: 0.25rem; }
    .player-card { background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(168, 85, 247, 0.5); border-radius: 0.75rem; padding: 1.5rem; text-align: center; }
    .code-display { background: rgba(88, 28, 135, 0.3); border: 2px solid rgba(168, 85, 247, 0.5); padding: 1rem 2rem; border-radius: 999px; display: inline-block; margin-bottom: 1.5rem; }
    .error-box, .success-box { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); padding: 1rem 1.5rem; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 100; max-width: 28rem; color: white; }
    .error-box { background: #dc2626; }
    .success-box { background: #16a34a; }
    .announcement { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: rgba(88, 28, 135, 0.9); border: 2px solid rgba(168, 85, 247, 0.5); padding: 1rem 2rem; border-radius: 0.75rem; z-index: 100; max-width: 56rem; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    .status-indicator { position: fixed; bottom: 1rem; right: 1rem; background: rgba(0, 0, 0, 0.8); padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.75rem; z-index: 50; cursor: pointer; }
    .info-box { background: rgba(59, 130, 246, 0.2); border: 2px solid rgba(59, 130, 246, 0.5); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Using a simple, free cloud storage API
    const STORAGE_URL = 'https://api.jsonstorage.net/v1/json';
    
    let state = {
      view: 'home',
      hostName: '',
      playerName: '',
      gameCode: '',
      theme: '',
      gameMode: 'normal',
      currentGame: null,
      error: '',
      success: '',
      countdown: 0,
      announcement: '',
      currentQuestion: null,
      selectedAnswer: null,
      hasAnswered: false,
      timeLeft: 0,
      storageId: null
    };

    let questionTimer = null;
    let pollInterval = null;

    // Trivia questions database
    const triviaQuestions = {
      'Logic': [
        { question: "If all roses are flowers and some flowers fade quickly, can we conclude that some roses fade quickly?", options: ["Yes", "No", "Cannot be determined", "Only in summer"], correct: 2 },
        { question: "A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost?", options: ["$0.10", "$0.05", "$0.15", "$0.20"], correct: 1 },
        { question: "What comes next in the sequence: 2, 6, 12, 20, 30, ?", options: ["36", "40", "42", "38"], correct: 2 },
        { question: "If you're running a race and you pass the person in 2nd place, what place are you in?", options: ["1st place", "2nd place", "3rd place", "Depends on total runners"], correct: 1 },
        { question: "Which is heavier: a pound of feathers or a pound of gold?", options: ["Feathers", "Gold", "They weigh the same", "Gold is heavier"], correct: 2 },
        { question: "What is the missing number: 1, 1, 2, 3, 5, 8, ?, 21", options: ["11", "13", "15", "17"], correct: 1 },
        { question: "If it takes 5 machines 5 minutes to make 5 widgets, how long would it take 100 machines to make 100 widgets?", options: ["100 minutes", "20 minutes", "5 minutes", "1 minute"], correct: 2 },
        { question: "A doctor gives you 3 pills and tells you to take one every half hour. How long will the pills last?", options: ["1.5 hours", "1 hour", "30 minutes", "2 hours"], correct: 1 }
      ],
      'Science': [
        { question: "What is the chemical symbol for gold?", options: ["Go", "Gd", "Au", "Ag"], correct: 2 },
        { question: "How many planets are in our solar system?", options: ["7", "8", "9", "10"], correct: 1 },
        { question: "What is the speed of light?", options: ["300,000 km/s", "150,000 km/s", "450,000 km/s", "200,000 km/s"], correct: 0 },
        { question: "What is the largest organ in the human body?", options: ["Heart", "Brain", "Liver", "Skin"], correct: 3 },
        { question: "What gas do plants absorb from the atmosphere?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: 2 },
        { question: "What is H2O commonly known as?", options: ["Hydrogen Peroxide", "Water", "Acid", "Salt"], correct: 1 },
        { question: "How many bones are in the adult human body?", options: ["186", "206", "226", "246"], correct: 1 },
        { question: "What planet is known as the Red Planet?", options: ["Venus", "Jupiter", "Mars", "Saturn"], correct: 2 }
      ],
      'History': [
        { question: "In what year did World War II end?", options: ["1943", "1944", "1945", "1946"], correct: 2 },
        { question: "Who was the first President of the United States?", options: ["Thomas Jefferson", "George Washington", "John Adams", "Benjamin Franklin"], correct: 1 },
        { question: "Which ancient wonder is still standing?", options: ["Colossus of Rhodes", "Great Pyramid of Giza", "Hanging Gardens", "Lighthouse of Alexandria"], correct: 1 },
        { question: "What year did the Berlin Wall fall?", options: ["1987", "1988", "1989", "1990"], correct: 2 },
        { question: "Who was the first person to walk on the moon?", options: ["Buzz Aldrin", "Neil Armstrong", "Yuri Gagarin", "Michael Collins"], correct: 1 },
        { question: "In which year did Columbus reach the Americas?", options: ["1490", "1492", "1494", "1496"], correct: 1 },
        { question: "Who painted the Mona Lisa?", options: ["Michelangelo", "Raphael", "Leonardo da Vinci", "Donatello"], correct: 2 },
        { question: "What was the name of the ship that brought the Pilgrims to America?", options: ["Mayflower", "Santa Maria", "Discovery", "Endeavour"], correct: 0 }
      ]
    };

    function getRandomQuestion(theme) {
      const questions = triviaQuestions[theme] || triviaQuestions['Logic'];
      return questions[Math.floor(Math.random() * questions.length)];
    }

    function generateCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function showError(msg) {
      state.error = msg;
      render();
      setTimeout(() => { state.error = ''; render(); }, 3000);
    }

    function showSuccess(msg) {
      state.success = msg;
      render();
      setTimeout(() => { state.success = ''; render(); }, 3000);
    }

    // Save game to cloud
    async function saveGame(game) {
      try {
        const storageId = localStorage.getItem(`game_${game.code}_id`);
        const url = storageId ? 
          `${STORAGE_URL}/${storageId}` : 
          `${STORAGE_URL}?apiKey=free`;
        
        const response = await fetch(url, {
          method: storageId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(game)
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.uri && !storageId) {
            const id = data.uri.split('/').pop();
            localStorage.setItem(`game_${game.code}_id`, id);
            state.storageId = id;
          }
          return true;
        }
        return false;
      } catch (error) {
        console.error('Save error:', error);
        return false;
      }
    }

    // Load game from cloud
    async function loadGame(code) {
      try {
        const storageId = localStorage.getItem(`game_${code}_id`);
        if (!storageId) return null;
        
        const response = await fetch(`${STORAGE_URL}/${storageId}?apiKey=free`);
        if (response.ok) {
          return await response.json();
        }
        return null;
      } catch (error) {
        console.error('Load error:', error);
        return null;
      }
    }

    // Start polling for game updates
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      
      pollInterval = setInterval(async () => {
        if (state.gameCode) {
          const game = await loadGame(state.gameCode);
          if (game && JSON.stringify(game) !== JSON.stringify(state.currentGame)) {
            state.currentGame = game;
            
            // Sync question across all players
            if (game.currentQuestion && !state.currentQuestion) {
              state.currentQuestion = game.currentQuestion;
              state.view = 'playing';
              state.hasAnswered = false;
              state.selectedAnswer = null;
              state.timeLeft = 15;
            }
            
            if (game.announcement) {
              state.announcement = game.announcement;
            }
            
            render();
          }
        }
      }, 1500); // Poll every 1.5 seconds
    }

    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    async function createGame() {
      if (!state.hostName || !state.theme) {
        showError('Please fill in all fields');
        return;
      }

      const code = generateCode();
      const newGame = {
        code,
        host: state.hostName,
        theme: state.theme,
        mode: state.gameMode,
        players: [{ name: state.hostName, id: Date.now(), isHost: true }],
        status: 'lobby',
        announcement: '',
        timestamp: Date.now()
      };

      state.gameCode = code;
      state.playerName = state.hostName;
      state.currentGame = newGame;
      
      const saved = await saveGame(newGame);
      if (saved) {
        startPolling();
        state.view = 'lobby';
        showSuccess('Game created! Share code: ' + code);
      } else {
        showError('Failed to create game. Try again.');
      }
    }

    async function joinGame() {
      if (!state.playerName || !state.gameCode) {
        showError('Please fill in all fields');
        return;
      }

      const game = await loadGame(state.gameCode);
      
      if (!game) {
        showError('Game not found! Make sure the host created the game and shared the correct code.');
        return;
      }

      if (game.status !== 'lobby') {
        showError('Game already started!');
        return;
      }

      const exists = game.players.find(p => p.name === state.playerName);
      if (!exists) {
        game.players.push({ name: state.playerName, id: Date.now(), isHost: false });
        game.timestamp = Date.now();
        await saveGame(game);
      }

      state.currentGame = game;
      state.gameCode = state.gameCode;
      state.view = 'lobby';
      startPolling();
      showSuccess('Joined successfully!');
    }

    async function startTournament() {
      if (!state.currentGame || state.currentGame.players.length < 2) {
        showError('Need at least 2 players!');
        return;
      }

      const matchups = state.currentGame.players.map((p, i) => 
        i % 2 === 0 && i + 1 < state.currentGame.players.length
          ? `${p.name} vs ${state.currentGame.players[i + 1].name}`
          : ''
      ).filter(Boolean).join(' • ');

      state.currentGame.announcement = `MATCHUPS: ${matchups}`;
      state.currentGame.status = 'playing';
      state.currentGame.timestamp = Date.now();
      await saveGame(state.currentGame);
      
      state.announcement = state.currentGame.announcement;
      render();
      
      await new Promise(r => setTimeout(r, 5000));
      
      state.announcement = '';
      state.currentGame.announcement = '';
      state.currentGame.timestamp = Date.now();
      await saveGame(state.currentGame);
      render();
      
      for (let i = 3; i > 0; i--) {
        state.countdown = i;
        render();
        await new Promise(r => setTimeout(r, 1000));
      }
      
      state.countdown = 0;
      
      // Start the first question
      startQuestion();
    }

    async function startQuestion() {
      // Clear any existing timer
      if (questionTimer) {
        clearInterval(questionTimer);
        questionTimer = null;
      }
      
      state.view = 'playing';
      state.hasAnswered = false;
      state.selectedAnswer = null;
      state.timeLeft = 15;
      
      const question = getRandomQuestion(state.currentGame.theme);
      state.currentQuestion = question;
      
      state.currentGame.currentQuestion = question;
      state.currentGame.timestamp = Date.now();
      await saveGame(state.currentGame);
      
      render();
      
      // Start timer
      questionTimer = setInterval(() => {
        state.timeLeft--;
        render();
        
        if (state.timeLeft <= 0) {
          clearInterval(questionTimer);
          questionTimer = null;
          if (!state.hasAnswered) {
            showError('Time\'s up!');
            setTimeout(() => {
              showResults();
            }, 2000);
          }
        }
      }, 1000);
    }

    function answerQuestion(answerIndex) {
      if (state.hasAnswered) return;
      
      // Stop the timer immediately
      if (questionTimer) {
        clearInterval(questionTimer);
        questionTimer = null;
      }
      
      state.hasAnswered = true;
      state.selectedAnswer = answerIndex;
      
      const isCorrect = answerIndex === state.currentQuestion.correct;
      
      if (isCorrect) {
        showSuccess('Correct! ✅');
      } else {
        showError('Wrong! ❌');
      }
      
      render();
      
      setTimeout(() => {
        showResults();
      }, 2000);
    }

    async function showResults() {
      // Make sure timer is cleared
      if (questionTimer) {
        clearInterval(questionTimer);
        questionTimer = null;
      }
      
      state.view = 'results';
      render();
      
      setTimeout(async () => {
        // Reset question state
        state.currentQuestion = null;
        state.selectedAnswer = null;
        state.hasAnswered = false;
        state.timeLeft = 0;
        
        // Go back to lobby
        state.view = 'lobby';
        state.currentGame.status = 'lobby';
        state.currentGame.currentQuestion = null;
        state.currentGame.timestamp = Date.now();
        await saveGame(state.currentGame);
        render();
      }, 3000);
    }

    const icons = {
      trophy: `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:100%;height:100%"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>`,
      users: `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:100%;height:100%"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`,
      crown: `<svg fill="currentColor" viewBox="0 0 20 20" style="width:100%;height:100%"><path fill-rule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 010 1.732l-3.354 1.935-1.18 4.455a1 1 0 01-1.933 0L9.854 12.8 6.5 10.866a1 1 0 010-1.732l3.354-1.935 1.18-4.455A1 1 0 0112 2z" clip-rule="evenodd"/></svg>`
    };

    function render() {
      try {
        const app = document.getElementById('app');
        if (!app) return;
        
        let html = '';

        if (state.error) html += `<div class="error-box">${state.error}</div>`;
        if (state.success) html += `<div class="success-box">${state.success}</div>`;
        if (state.countdown > 0) html += `<div class="overlay"><div class="countdown-num title glow">${state.countdown}</div></div>`;
        if (state.announcement) html += `<div class="announcement"><div style="font-size:0.75rem;color:#d8b4fe;margin-bottom:0.25rem">ANNOUNCEMENT</div><div class="title" style="font-size:1.25rem">${state.announcement}</div></div>`;

        if (state.view === 'home') {
        html += `
          <div class="container slide-up" style="padding-top:4rem">
            <div class="text-center mb-12">
              <div class="icon-lg pulse">${icons.trophy}</div>
              <h1 class="title glow" style="font-size:4.5rem;margin-bottom:1rem">TRIVIA<br/>TOURNAMENT</h1>
              <p style="font-size:1.125rem;color:#d8b4fe">Battle in bracket-style trivia with epic powerups!</p>
              <p style="font-size:0.875rem;color:#9ca3af;margin-top:1rem">🌍 Play with ANYONE on ANY device!</p>
            </div>
            <div class="info-box text-center">
              <div style="font-size:0.875rem;font-weight:600;margin-bottom:0.5rem;color:#60a5fa">🚀 REAL ONLINE MULTIPLAYER</div>
              <p style="font-size:0.75rem;color:#bfdbfe">Zero setup! Works across phones, tablets, and computers!</p>
            </div>
            <div class="grid-2">
              <button class="btn-purple card" onclick="state.view='create';render()" style="padding:2rem">
                <div class="icon-md" style="color:#c084fc">${icons.crown}</div>
                <div class="title" style="font-size:1.5rem;margin-bottom:0.5rem">HOST GAME</div>
                <p style="font-size:0.875rem;color:#e9d5ff">Create tournament</p>
              </button>
              <button class="btn-blue card" onclick="state.view='join';render()" style="padding:2rem">
                <div class="icon-md" style="color:#60a5fa">${icons.users}</div>
                <div class="title" style="font-size:1.5rem;margin-bottom:0.5rem">JOIN GAME</div>
                <p style="font-size:0.875rem;color:#bfdbfe">Enter code</p>
              </button>
            </div>
          </div>
        `;
      } else if (state.view === 'create') {
        html += `
          <div class="container-sm slide-up" style="padding-top:4rem">
            <button onclick="state.view='home';render()" class="mb-8" style="background:transparent;color:#c084fc;padding:0.5rem 1rem">← Back</button>
            <div class="card">
              <div class="icon-md mb-6" style="color:#c084fc">${icons.crown}</div>
              <h2 class="title text-center mb-8" style="font-size:1.875rem">CREATE TOURNAMENT</h2>
              <div class="mb-6">
                <label style="display:block;font-size:0.875rem;font-weight:600;margin-bottom:0.5rem;color:#d8b4fe">YOUR NAME</label>
                <input type="text" placeholder="Enter your name" value="${state.hostName}" oninput="state.hostName=this.value">
              </div>
              <div class="mb-6">
                <label style="display:block;font-size:0.875rem;font-weight:600;margin-bottom:0.5rem;color:#d8b4fe">TRIVIA THEME</label>
                <input type="text" placeholder="e.g., Logic, Science, History" value="${state.theme}" oninput="state.theme=this.value">
              </div>
              <div class="mb-6">
                <label style="display:block;font-size:0.875rem;font-weight:600;margin-bottom:0.75rem;color:#d8b4fe">GAME MODE</label>
                <div class="grid-2">
                  <button type="button" onclick="state.gameMode='normal';render()" style="padding:1rem;background:${state.gameMode==='normal'?'rgba(88,28,135,0.3)':'rgba(30,41,59,0.3)'};border:2px solid ${state.gameMode==='normal'?'rgba(168,85,247,0.5)':'#334155'};border-radius:0.5rem">
                    <div style="font-weight:700;margin-bottom:0.25rem">NORMAL</div>
                    <div style="font-size:0.75rem;color:#9ca3af">Classic trivia</div>
                  </button>
                  <button type="button" onclick="state.gameMode='special';render()" style="padding:1rem;background:${state.gameMode==='special'?'rgba(88,28,135,0.3)':'rgba(30,41,59,0.3)'};border:2px solid ${state.gameMode==='special'?'rgba(168,85,247,0.5)':'#334155'};border-radius:0.5rem">
                    <div style="font-weight:700;margin-bottom:0.25rem">SPECIAL</div>
                    <div style="font-size:0.75rem;color:#9ca3af">With powerups!</div>
                  </button>
                </div>
              </div>
              <button onclick="createGame()" class="btn-purple title" style="width:100%;font-size:1.25rem">CREATE GAME</button>
            </div>
          </div>
        `;
      } else if (state.view === 'join') {
        html += `
          <div class="container-sm slide-up" style="padding-top:4rem">
            <button onclick="state.view='home';render()" class="mb-8" style="background:transparent;color:#c084fc;padding:0.5rem 1rem">← Back</button>
            <div class="card">
              <div class="icon-md mb-6" style="color:#60a5fa">${icons.users}</div>
              <h2 class="title text-center mb-8" style="font-size:1.875rem">JOIN TOURNAMENT</h2>
              <div class="mb-6">
                <label style="display:block;font-size:0.875rem;font-weight:600;margin-bottom:0.5rem;color:#d8b4fe">YOUR NAME</label>
                <input type="text" placeholder="Enter your name" value="${state.playerName}" oninput="state.playerName=this.value">
              </div>
              <div class="mb-6">
                <label style="display:block;font-size:0.875rem;font-weight:600;margin-bottom:0.5rem;color:#d8b4fe">GAME CODE</label>
                <input type="text" placeholder="XXXXXX" maxlength="6" value="${state.gameCode}" oninput="state.gameCode=this.value.toUpperCase()" style="text-align:center;font-size:1.5rem;letter-spacing:0.1em;text-transform:uppercase">
              </div>
              <button onclick="joinGame()" class="btn-blue title" style="width:100%;font-size:1.25rem">JOIN GAME</button>
            </div>
          </div>
        `;
      } else if (state.view === 'lobby' && state.currentGame) {
        const isHost = state.currentGame.host === state.playerName;
        html += `
          <div class="container-lg slide-up" style="padding-top:2rem">
            <div class="text-center mb-12">
              <div class="code-display">
                <div style="font-size:0.875rem;color:#d8b4fe;margin-bottom:0.25rem">GAME CODE</div>
                <div class="title" style="font-size:2.25rem;letter-spacing:0.1em">${state.currentGame.code}</div>
              </div>
              <h2 class="title" style="font-size:1.875rem;margin-bottom:0.5rem">WAITING FOR PLAYERS</h2>
              <p style="color:#d8b4fe">Theme: <span style="font-weight:600;color:white">${state.currentGame.theme}</span></p>
              <p style="font-size:0.875rem;color:#c084fc;margin-top:0.5rem">Mode: <span style="font-weight:600;color:white">${state.currentGame.mode==='special'?'⚡ SPECIAL (Powerups!)':'NORMAL'}</span></p>
              ${state.currentGame.mode==='special'?`
              <div class="mt-6" style="display:inline-block;background:rgba(124,45,18,0.3);padding:1rem;border-radius:0.5rem;border:2px solid rgba(168,85,247,0.5)">
                <div style="font-size:0.75rem;color:#9ca3af;margin-bottom:0.5rem">AVAILABLE POWERUPS:</div>
                <div style="font-size:1.5rem;display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap">
                  <span title="Ice Freeze" class="powerup-icon">❄️</span>
                  <span title="Fireball" class="powerup-icon">🔥</span>
                  <span title="Double Trouble" class="powerup-icon">✌️</span>
                  <span title="Shield" class="powerup-icon">🛡️</span>
                  <span title="Switch" class="powerup-icon">🔄</span>
                  <span title="Battlestar" class="powerup-icon">⭐</span>
                </div>
              </div>
              `:''}
            </div>
            <div class="grid-3 mb-12">
              ${state.currentGame.players.map(p => `
                <div class="player-card">
                  ${p.isHost?`<div class="icon-sm" style="color:#fbbf24;margin:0 auto 0.5rem">${icons.crown}</div>`:''}
                  <div style="font-weight:600;font-size:1.125rem">${p.name}</div>
                  ${p.isHost?'<div style="font-size:0.75rem;color:#c084fc;margin-top:0.25rem">HOST</div>':''}
                </div>
              `).join('')}
            </div>
            ${isHost?`
            <div style="text-align:center">
              <button onclick="startTournament()" ${state.currentGame.players.length<2?'disabled':''} class="btn-green title" style="font-size:1.5rem;padding:1rem 3rem">
                ⚡ START TOURNAMENT
              </button>
            </div>
            `:''}
          </div>
        `;
      } else if (state.view === 'playing' && state.currentQuestion) {
        html += `
          <div class="container slide-up" style="padding-top:2rem">
            <div class="card" style="margin-bottom:2rem">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem">
                <div style="font-size:0.875rem;color:#d8b4fe">
                  <span style="font-weight:600">Theme:</span> ${state.currentGame.theme}
                </div>
                <div style="font-size:2rem;font-weight:900;color:${state.timeLeft <= 5 ? '#ef4444' : '#10b981'}">
                  ${state.timeLeft}s
                </div>
              </div>
              
              <h2 class="title text-center mb-12" style="font-size:1.875rem;line-height:1.4">
                ${state.currentQuestion.question}
              </h2>
              
              <div class="grid-2" style="gap:1rem">
                ${state.currentQuestion.options.map((option, i) => {
                  let bgColor = 'rgba(30,41,59,0.3)';
                  let borderColor = '#334155';
                  
                  if (state.hasAnswered) {
                    if (i === state.currentQuestion.correct) {
                      bgColor = 'rgba(34,197,94,0.3)';
                      borderColor = '#22c55e';
                    } else if (i === state.selectedAnswer && i !== state.currentQuestion.correct) {
                      bgColor = 'rgba(239,68,68,0.3)';
                      borderColor = '#ef4444';
                    }
                  } else if (state.selectedAnswer === i) {
                    bgColor = 'rgba(88,28,135,0.3)';
                    borderColor = 'rgba(168,85,247,0.5)';
                  }
                  
                  return `
                    <button 
                      onclick="answerQuestion(${i})" 
                      ${state.hasAnswered ? 'disabled' : ''}
                      style="padding:1.5rem;background:${bgColor};border:2px solid ${borderColor};border-radius:0.75rem;font-size:1.125rem;font-weight:600;min-height:5rem;display:flex;align-items:center;justify-content:center;text-align:center"
                    >
                      ${option}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (state.view === 'results') {
        const wasCorrect = state.selectedAnswer === state.currentQuestion.correct;
        html += `
          <div class="container text-center slide-up" style="padding-top:8rem">
            <div style="font-size:8rem;margin-bottom:2rem">
              ${wasCorrect ? '✅' : '❌'}
            </div>
            <h2 class="title" style="font-size:3rem;margin-bottom:1rem">
              ${wasCorrect ? 'CORRECT!' : 'WRONG!'}
            </h2>
            <p style="font-size:1.25rem;color:#d8b4fe;margin-bottom:1rem">
              The answer was: <span style="font-weight:700;color:#22c55e">${state.currentQuestion.options[state.currentQuestion.correct]}</span>
            </p>
            <p style="font-size:0.875rem;color:#9ca3af">Returning to lobby...</p>
          </div>
        `;
      }

      html += `
        <div class="status-indicator" onclick="this.style.display='none'" title="Click to dismiss">
          <div style="color:#4ade80">✅ Online & Ready!</div>
          <div style="color:#9ca3af">Cross-device enabled • Click to hide</div>
        </div>
      `;

      app.innerHTML = html;
      } catch (error) {
        console.error('Render error:', error);
      }
    }

    render();
  </script>
</body>
</html>
