<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Tournament - Online</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom right, #020617, #3b0764, #020617); color: white; min-height: 100vh; }
    .container { max-width: 56rem; margin: 0 auto; padding: 2rem; }
    .container-sm { max-width: 28rem; margin: 0 auto; padding: 2rem; }
    .container-lg { max-width: 72rem; margin: 0 auto; padding: 2rem; }
    .card { background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(168, 85, 247, 0.5); border-radius: 1rem; padding: 2rem; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    .title { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: -0.05em; }
    .glow { text-shadow: 0 0 20px rgba(168, 85, 247, 0.5), 0 0 40px rgba(168, 85, 247, 0.3); }
    button { border: none; cursor: pointer; color: white; padding: 1rem 2rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.3s; font-size: 1rem; font-family: inherit; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(168, 85, 247, 0.4); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-purple { background: linear-gradient(to right, #9333ea, #6b21a8); border: 2px solid rgba(168, 85, 247, 0.5); }
    .btn-blue { background: linear-gradient(to right, #2563eb, #1e40af); border: 2px solid rgba(59, 130, 246, 0.5); }
    .btn-green { background: linear-gradient(to right, #16a34a, #065f46); border: 2px solid rgba(34, 197, 94, 0.5); }
    input { width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(168, 85, 247, 0.3); border-radius: 0.5rem; color: white; font-size: 1rem; outline: none; font-family: inherit; }
    input::placeholder { color: rgba(255, 255, 255, 0.5); }
    input:focus { border-color: rgba(168, 85, 247, 0.8); box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .text-center { text-align: center; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mb-12 { margin-bottom: 3rem; }
    .mt-6 { margin-top: 1.5rem; }
    .icon-lg { width: 6rem; height: 6rem; margin: 0 auto 1.5rem; color: #c084fc; }
    .icon-md { width: 4rem; height: 4rem; margin: 0 auto 1rem; }
    .icon-sm { width: 1.5rem; height: 1.5rem; display: inline-block; margin-right: 0.5rem; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .slide-up { animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes countdown { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    .countdown-num { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10rem; z-index: 100; animation: countdown 1s ease-out; }
    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 99; }
    .powerup-icon { font-size: 2rem; padding: 0.5rem; background: rgba(88, 28, 135, 0.3); border: 2px solid rgba(168, 85, 247, 0.5); border-radius: 0.5rem; display: inline-block; margin: 0.25rem; cursor: pointer; transition: all 0.3s; }
    .powerup-icon:hover { transform: scale(1.1); background: rgba(168, 85, 247, 0.5); }
    .player-card { background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(168, 85, 247, 0.5); border-radius: 0.75rem; padding: 1.5rem; text-align: center; position: relative; }
    .player-card.frozen { border-color: #60a5fa; background: rgba(59, 130, 246, 0.2); }
    .player-card.eliminated { opacity: 0.5; border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.1); }
    .frozen-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(96, 165, 250, 0.3); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .code-display { background: rgba(88, 28, 135, 0.3); border: 2px solid rgba(168, 85, 247, 0.5); padding: 1rem 2rem; border-radius: 999px; display: inline-block; margin-bottom: 1.5rem; }
    .error-box, .success-box { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); padding: 1rem 1.5rem; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 100; max-width: 28rem; color: white; }
    .error-box { background: #dc2626; }
    .success-box { background: #16a34a; }
    .announcement { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: rgba(88, 28, 135, 0.9); border: 2px solid rgba(168, 85, 247, 0.5); padding: 1rem 2rem; border-radius: 0.75rem; z-index: 100; max-width: 56rem; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    .status-indicator { position: fixed; bottom: 1rem; right: 1rem; background: rgba(0, 0, 0, 0.8); padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.75rem; z-index: 50; cursor: pointer; }
    .info-box { background: rgba(59, 130, 246, 0.2); border: 2px solid rgba(59, 130, 246, 0.5); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1.5rem; }
    .timer-circle { width: 120px; height: 120px; margin: 0 auto 2rem; position: relative; }
    .timer-circle svg { transform: rotate(-90deg); }
    .timer-circle circle { fill: none; stroke-width: 8; }
    .timer-bg { stroke: rgba(255, 255, 255, 0.1); }
    .timer-progress { stroke: #10b981; transition: stroke 0.3s, stroke-dashoffset 1s linear; }
    .timer-progress.warning { stroke: #f59e0b; }
    .timer-progress.danger { stroke: #ef4444; }
    .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; font-weight: 900; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Use JSONServer.io - Free cloud JSON storage (no API key needed!)
    const STORAGE_URL = 'https://jsonserver.io/api';
    const PROJECT_ID = 'trivia-tournament-' + window.location.hostname.replace(/\./g, '-');
    
    // Helper functions for cloud storage
    async function saveGameCloud(game) {
      try {
        const gameId = `game_${game.code}`;
        
        // Try to update first
        let response = await fetch(`${STORAGE_URL}/${PROJECT_ID}/${gameId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(game)
        });
        
        // If update fails, create new
        if (!response.ok) {
          response = await fetch(`${STORAGE_URL}/${PROJECT_ID}/${gameId}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(game)
          });
        }
        
        if (response.ok) {
          if (bc) bc.postMessage({ type: 'game_update', code: game.code, game });
          return true;
        }
        return false;
      } catch (e) {
        // Fallback to localStorage
        try {
          const games = JSON.parse(localStorage.getItem('trivia_games') || '{}');
          games[game.code] = game;
          localStorage.setItem('trivia_games', JSON.stringify(games));
          if (bc) bc.postMessage({ type: 'game_update', code: game.code, game });
          return true;
        } catch (err) {
          return false;
        }
      }
    }
    
    async function loadGameCloud(code) {
      try {
        const gameId = `game_${code}`;
        const response = await fetch(`${STORAGE_URL}/${PROJECT_ID}/${gameId}`);
        
        if (response.ok) {
          const data = await response.json();
          return data;
        }
        
        // Fallback to localStorage
        const games = JSON.parse(localStorage.getItem('trivia_games') || '{}');
        return games[code] || null;
      } catch (e) {
        // Fallback to localStorage
        try {
          const games = JSON.parse(localStorage.getItem('trivia_games') || '{}');
          return games[code] || null;
        } catch (err) {
          return null;
        }
      }
    }
    
    const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('trivia_sync') : null;
    
    let state = {
      view: 'home',
      hostName: '',
      playerName: '',
      gameCode: '',
      theme: '',
      gameMode: 'normal',
      currentGame: null,
      error: '',
      success: '',
      countdown: 0,
      announcement: '',
      currentQuestion: null,
      selectedAnswer: null,
      hasAnswered: false,
      timeLeft: 0,
      isFrozen: false,
      freezeTimeLeft: 0,
      answerTime: null, // Track when player answered
      showPowerupMenu: false // Track if powerup menu is open
    };

    let questionTimer = null;
    let pollInterval = null;
    let freezeTimer = null;
    let questionStartTime = null; // Track when question started
    
    function togglePowerupMenu() {
      state.showPowerupMenu = !state.showPowerupMenu;
      renderStatic();
    }
    
    function hasPowerups() {
      if (!state.currentGame) return false;
      const myPlayer = state.currentGame.players.find(p => p.name === state.playerName);
      if (!myPlayer) return false;
      
      const total = Object.values(myPlayer.powerups).reduce((sum, count) => sum + count, 0);
      return total > 0;
    }
    
    // Listen for updates from other tabs (same device)
    if (bc) {
      bc.onmessage = (event) => {
        if (event.data.type === 'game_update' && event.data.code === state.gameCode) {
          const game = event.data.game;
          if (game && JSON.stringify(game) !== JSON.stringify(state.currentGame)) {
            syncGameState(game);
          }
        }
      };
    }
    
    // Poll cloud storage for changes (cross-device sync)
    setInterval(async () => {
      if (state.gameCode && state.currentGame) {
        const game = await loadGameCloud(state.gameCode);
        if (game && JSON.stringify(game) !== JSON.stringify(state.currentGame)) {
          syncGameState(game);
        }
      }
    }, 2000); // Poll every 2 seconds
    
    function syncGameState(game) {
      state.currentGame = game;
      
      // Check for attack notifications
      if (game.attackNotification && game.attackNotification.timestamp > (Date.now() - 5000)) {
        const attack = game.attackNotification;
        const myPlayer = game.players.find(p => p.name === state.playerName);
        
        // Show notification if this player was attacked (or for Battlestar, everyone)
        if (attack.attacker !== state.playerName) {
          if (attack.type === 'freeze') {
            showError(`⚠️ Uh oh! You just got attacked by ${attack.attacker} with ICE FREEZE! ❄️`);
          } else if (attack.type === 'fireball' && attack.victim === state.playerName) {
            const powerupIcons = { freeze: '❄️', shield: '🛡️', double: '✌️', fireball: '🔥', switch: '🔄', star: '⭐' };
            const lostPowerup = powerupIcons[attack.destroyedPowerup] || attack.destroyedPowerup;
            showError(`⚠️ Uh oh! ${attack.attacker} hit you with a FIREBALL! 🔥 You lost ${lostPowerup}!`);
          } else if (attack.type === 'switch' && attack.victim === state.playerName) {
            showError(`⚠️ Uh oh! ${attack.attacker} used SWITCH on you! 🔄 Your scores were swapped!`);
          } else if (attack.type === 'star') {
            state.announcement = `⭐ BATTLESTAR!! ${attack.attacker} triggered the ultimate challenge!`;
          }
        }
      }
      
      // Sync bracket results
      if (game.bracketResults && state.view !== 'bracketResults') {
        state.view = 'bracketResults';
      }
      
      // Sync podium
      if (game.status === 'podium') {
        state.view = 'podium';
      }
      
      // Sync matchup result
      if (game.matchupResult && state.view !== 'matchupResult') {
        state.view = 'matchupResult';
      }
      
      // Check if frozen
      const myPlayer = game.players.find(p => p.name === state.playerName);
      if (myPlayer && myPlayer.frozenUntil && myPlayer.frozenUntil > Date.now()) {
        if (!state.isFrozen) {
          state.isFrozen = true;
          startFreezeTimer(myPlayer.frozenUntil);
        }
      } else {
        state.isFrozen = false;
        if (freezeTimer) {
          clearInterval(freezeTimer);
          freezeTimer = null;
        }
      }
      
      if (game.currentQuestion && !state.currentQuestion && !game.isBracketRound) {
        state.currentQuestion = game.currentQuestion;
        state.view = 'playing';
        state.hasAnswered = false;
        state.selectedAnswer = null;
        state.timeLeft = 15;
        questionStartTime = Date.now();
        startQuestionTimer();
      }
      
      // Sync bracket round
      if (game.isBracketRound && !state.currentQuestion) {
        state.currentQuestion = game.currentQuestion;
        state.view = 'playing';
        state.hasAnswered = false;
        state.selectedAnswer = null;
        state.timeLeft = 15;
        questionStartTime = Date.now();
        startQuestionTimer();
      }
      
      // Sync matchup start
      if (game.currentMatchup && !state.currentQuestion && state.view !== 'matchupResult') {
        state.currentQuestion = game.currentQuestion;
        state.view = 'playing';
        state.hasAnswered = false;
        state.selectedAnswer = null;
        state.timeLeft = 15;
        questionStartTime = Date.now();
        startQuestionTimer();
      }
      
      if (game.announcement) {
        state.announcement = game.announcement;
      }
      
      renderStatic();
    }

    // Trivia questions database
    const triviaQuestions = {
      'Logic': [
        { question: "If all roses are flowers and some flowers fade quickly, can we conclude that some roses fade quickly?", options: ["Yes", "No", "Cannot be determined", "Only in summer"], correct: 2 },
        { question: "A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball. How much does the ball cost?", options: ["$0.10", "$0.05", "$0.15", "$0.20"], correct: 1 },
        { question: "What comes next in the sequence: 2, 6, 12, 20, 30, ?", options: ["36", "40", "42", "38"], correct: 2 },
        { question: "If you're running a race and you pass the person in 2nd place, what place are you in?", options: ["1st place", "2nd place", "3rd place", "Depends on total runners"], correct: 1 },
        { question: "Which is heavier: a pound of feathers or a pound of gold?", options: ["Feathers", "Gold", "They weigh the same", "Gold is heavier"], correct: 2 },
        { question: "What is the missing number: 1, 1, 2, 3, 5, 8, ?, 21", options: ["11", "13", "15", "17"], correct: 1 },
        { question: "If it takes 5 machines 5 minutes to make 5 widgets, how long would it take 100 machines to make 100 widgets?", options: ["100 minutes", "20 minutes", "5 minutes", "1 minute"], correct: 2 },
        { question: "A doctor gives you 3 pills and tells you to take one every half hour. How long will the pills last?", options: ["1.5 hours", "1 hour", "30 minutes", "2 hours"], correct: 1 }
      ],
      'Science': [
        { question: "What is the chemical symbol for gold?", options: ["Go", "Gd", "Au", "Ag"], correct: 2 },
        { question: "How many planets are in our solar system?", options: ["7", "8", "9", "10"], correct: 1 },
        { question: "What is the speed of light?", options: ["300,000 km/s", "150,000 km/s", "450,000 km/s", "200,000 km/s"], correct: 0 },
        { question: "What is the largest organ in the human body?", options: ["Heart", "Brain", "Liver", "Skin"], correct: 3 },
        { question: "What gas do plants absorb from the atmosphere?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: 2 },
        { question: "What is H2O commonly known as?", options: ["Hydrogen Peroxide", "Water", "Acid", "Salt"], correct: 1 },
        { question: "How many bones are in the adult human body?", options: ["186", "206", "226", "246"], correct: 1 },
        { question: "What planet is known as the Red Planet?", options: ["Venus", "Jupiter", "Mars", "Saturn"], correct: 2 }
      ],
      'History': [
        { question: "In what year did World War II end?", options: ["1943", "1944", "1945", "1946"], correct: 2 },
        { question: "Who was the first President of the United States?", options: ["Thomas Jefferson", "George Washington", "John Adams", "Benjamin Franklin"], correct: 1 },
        { question: "Which ancient wonder is still standing?", options: ["Colossus of Rhodes", "Great Pyramid of Giza", "Hanging Gardens", "Lighthouse of Alexandria"], correct: 1 },
        { question: "What year did the Berlin Wall fall?", options: ["1987", "1988", "1989", "1990"], correct: 2 },
        { question: "Who was the first person to walk on the moon?", options: ["Buzz Aldrin", "Neil Armstrong", "Yuri Gagarin", "Michael Collins"], correct: 1 },
        { question: "In which year did Columbus reach the Americas?", options: ["1490", "1492", "1494", "1496"], correct: 1 },
        { question: "Who painted the Mona Lisa?", options: ["Michelangelo", "Raphael", "Leonardo da Vinci", "Donatello"], correct: 2 },
        { question: "What was the name of the ship that brought the Pilgrims to America?", options: ["Mayflower", "Santa Maria", "Discovery", "Endeavour"], correct: 0 }
      ]
    };

    function getRandomQuestion(theme) {
      const questions = triviaQuestions[theme] || triviaQuestions['Logic'];
      return questions[Math.floor(Math.random() * questions.length)];
    }

    function generateCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function showError(msg) {
      state.error = msg;
      renderStatic();
      setTimeout(() => { state.error = ''; renderStatic(); }, 3000);
    }

    function showSuccess(msg) {
      state.success = msg;
      renderStatic();
      setTimeout(() => { state.success = ''; renderStatic(); }, 3000);
    }

    function startFreezeTimer(frozenUntil) {
      if (freezeTimer) clearInterval(freezeTimer);
      
      freezeTimer = setInterval(() => {
        const timeLeft = Math.max(0, Math.ceil((frozenUntil - Date.now()) / 1000));
        state.freezeTimeLeft = timeLeft;
        
        if (timeLeft <= 0) {
          state.isFrozen = false;
          clearInterval(freezeTimer);
          freezeTimer = null;
        }
        
        renderStatic();
      }, 100);
    }

    function startPowerupMode() {
      if (!state.currentGame) return;
      
      state.currentGame.isPowerupMode = true;
      state.currentGame.powerupQuestionCount = 0;
      state.currentGame.timestamp = Date.now();
      saveGameCloud(state.currentGame);
      
      startQuestion();
    }

    function endBracketRound() {
      // Sort players by bracket scores
      const bracketPlayers = Object.entries(state.currentGame.bracketScores)
        .map(([name, score]) => ({ name, score }))
        .sort((a, b) => b.score - a.score);
      
      // Calculate cutoff - top half advances
      const totalPlayers = bracketPlayers.length;
      const advancingCount = Math.ceil(totalPlayers / 2);
      const cutoffScore = bracketPlayers[advancingCount - 1]?.score || 0;
      
      // Eliminate bottom half
      const eliminated = [];
      bracketPlayers.forEach((player, index) => {
        if (index >= advancingCount) {
          const p = state.currentGame.players.find(pl => pl.name === player.name);
          if (p) {
            p.eliminated = true;
            eliminated.push(player.name);
          }
        }
      });
      
      // Show bracket results
      state.currentGame.bracketResults = bracketPlayers;
      state.currentGame.advancingCount = advancingCount;
      state.view = 'bracketResults';
      
      // Clean up bracket round state
      state.currentGame.isBracketRound = false;
      state.currentGame.bracketQuestionCount = 0;
      state.currentQuestion = null;
      
      saveGameCloud(state.currentGame);
      renderStatic();
      
      // After showing results, check for podium or return to lobby
      setTimeout(() => {
        if (checkForPodium()) {
          showPodium();
        } else {
          state.view = 'lobby';
          state.currentGame.status = 'lobby';
          state.currentGame.bracketResults = null;
          saveGameCloud(state.currentGame);
          renderStatic();
        }
      }, 5000);
    }

    function checkForPodium() {
      if (!state.currentGame) return false;
      
      const activePlayers = state.currentGame.players.filter(p => !p.eliminated);
      
      // Show podium if 3 or fewer players remain, or if only 1 player left
      if (activePlayers.length <= 3 && activePlayers.length >= 1) {
        return true;
      }
      
      return false;
    }

    function showPodium() {
      // Sort players by wins (descending)
      const rankedPlayers = [...state.currentGame.players]
        .filter(p => !p.eliminated || p.wins > 0)
        .sort((a, b) => b.wins - a.wins);
      
      state.currentGame.rankedPlayers = rankedPlayers;
      state.currentGame.status = 'podium';
      state.view = 'podium';
      saveGameCloud(state.currentGame);
      renderStatic();
    }

    function usePowerup(powerupType) {
      if (!state.currentGame || state.isFrozen) return;
      
      const myPlayer = state.currentGame.players.find(p => p.name === state.playerName);
      if (!myPlayer || !myPlayer.powerups[powerupType] || myPlayer.powerups[powerupType] <= 0) {
        showError('You don\'t have this powerup!');
        return;
      }
      
      if (powerupType === 'freeze') {
        // Freeze all other players for 3 seconds
        const freezeUntil = Date.now() + 3000;
        state.currentGame.players = state.currentGame.players.map(p => {
          if (p.name !== state.playerName && !p.eliminated) {
            return { ...p, frozenUntil: freezeUntil };
          }
          return p;
        });
        
        myPlayer.powerups.freeze--;
        
        // Set attack notification for victims
        state.currentGame.attackNotification = {
          type: 'freeze',
          attacker: state.playerName,
          timestamp: Date.now()
        };
        
        saveGameCloud(state.currentGame);
        showSuccess('❄️ Ice Freeze activated! Others frozen for 3 seconds!');
        renderStatic();
      } else if (powerupType === 'shield') {
        myPlayer.hasShield = true;
        myPlayer.powerups.shield--;
        saveGameCloud(state.currentGame);
        showSuccess('🛡️ Shield activated! Protected from elimination!');
        renderStatic();
      } else if (powerupType === 'double') {
        myPlayer.doublePoints = true;
        myPlayer.powerups.double--;
        saveGameCloud(state.currentGame);
        showSuccess('✌️ Double Points activated! Next win counts twice!');
        renderStatic();
      } else if (powerupType === 'fireball') {
        // Remove a random opponent's powerup
        const opponents = state.currentGame.players.filter(p => 
          p.name !== state.playerName && !p.eliminated
        );
        if (opponents.length > 0) {
          const randomOpponent = opponents[Math.floor(Math.random() * opponents.length)];
          const powerupKeys = Object.keys(randomOpponent.powerups).filter(k => randomOpponent.powerups[k] > 0);
          if (powerupKeys.length > 0) {
            const randomKey = powerupKeys[Math.floor(Math.random() * powerupKeys.length)];
            const destroyedPowerup = randomKey;
            randomOpponent.powerups[randomKey]--;
            myPlayer.powerups.fireball--;
            
            // Set attack notification for victim
            state.currentGame.attackNotification = {
              type: 'fireball',
              attacker: state.playerName,
              victim: randomOpponent.name,
              destroyedPowerup,
              timestamp: Date.now()
            };
            
            saveGameCloud(state.currentGame);
            showSuccess(`🔥 Fireball! Destroyed ${randomOpponent.name}'s powerup!`);
          } else {
            showError('No opponent has powerups to destroy!');
            return;
          }
        } else {
          showError('No opponents to target!');
          return;
        }
        renderStatic();
      } else if (powerupType === 'switch') {
        // Swap positions with random opponent
        const opponents = state.currentGame.players.filter(p => 
          p.name !== state.playerName && !p.eliminated
        );
        if (opponents.length > 0) {
          const randomOpponent = opponents[Math.floor(Math.random() * opponents.length)];
          const tempWins = myPlayer.wins;
          myPlayer.wins = randomOpponent.wins;
          randomOpponent.wins = tempWins;
          myPlayer.powerups.switch--;
          
          // Set attack notification for victim
          state.currentGame.attackNotification = {
            type: 'switch',
            attacker: state.playerName,
            victim: randomOpponent.name,
            timestamp: Date.now()
          };
          
          saveGameCloud(state.currentGame);
          showSuccess(`🔄 Switch! Swapped scores with ${randomOpponent.name}!`);
        } else {
          showError('No opponents to switch with!');
          return;
        }
        renderStatic();
      } else if (powerupType === 'star') {
        // Trigger bracket round - everyone plays, top half advances
        myPlayer.powerups.star--;
        state.currentGame.isBracketRound = true;
        state.currentGame.bracketScores = {};
        
        // Initialize bracket scores for all non-eliminated players
        state.currentGame.players.forEach(p => {
          if (!p.eliminated) {
            state.currentGame.bracketScores[p.name] = 0;
          }
        });
        
        // Set attack notification for everyone
        state.currentGame.attackNotification = {
          type: 'star',
          attacker: state.playerName,
          timestamp: Date.now()
        };
        
        saveGameCloud(state.currentGame);
        
        state.announcement = `⭐ ${state.playerName} activated BATTLESTAR!! Everyone competes - Top half advances!`;
        renderStatic();
        
        setTimeout(() => {
          state.announcement = '';
          state.currentGame.attackNotification = null;
          saveGameCloud(state.currentGame);
          renderStatic();
          startQuestion();
        }, 4000);
      }
    }

    async function createGame() {
      if (!state.hostName || !state.theme) {
        showError('Please fill in all fields');
        return;
      }

      const code = generateCode();
      const newGame = {
        code,
        host: state.hostName,
        theme: state.theme,
        mode: state.gameMode,
        players: [{ 
          name: state.hostName, 
          id: Date.now(), 
          isHost: true,
          powerups: { freeze: 0, shield: 0, double: 0, fireball: 0, switch: 0, star: 0 },
          wins: 0,
          losses: 0,
          eliminated: false
        }],
        status: 'lobby',
        announcement: '',
        timestamp: Date.now(),
        round: 0
      };

      state.gameCode = code;
      state.playerName = state.hostName;
      state.currentGame = newGame;
      
      const saved = await saveGameCloud(newGame);
      if (saved) {
        state.view = 'lobby';
        showSuccess('Game created! Share code: ' + code);
        renderStatic();
      } else {
        showError('Failed to create game. Try again.');
      }
    }

    async function joinGame() {
      if (!state.playerName || !state.gameCode) {
        showError('Please fill in all fields');
        return;
      }

      const game = await loadGameCloud(state.gameCode);
      
      if (!game) {
        showError('Game not found! Make sure the host created the game first and you have the correct code.');
        return;
      }

      if (game.status !== 'lobby') {
        showError('Game already started!');
        return;
      }

      const exists = game.players.find(p => p.name === state.playerName);
      if (!exists) {
        game.players.push({ 
          name: state.playerName, 
          id: Date.now(), 
          isHost: false,
          powerups: { freeze: 0, shield: 0, double: 0, fireball: 0, switch: 0, star: 0 },
          wins: 0,
          losses: 0,
          eliminated: false
        });
        game.timestamp = Date.now();
        await saveGameCloud(game);
      }

      state.currentGame = game;
      state.view = 'lobby';
      showSuccess('Joined successfully!');
      renderStatic();
    }

    async function startTournament() {
      if (!state.currentGame || state.currentGame.players.filter(p => !p.eliminated).length < 2) {
        showError('Need at least 2 players!');
        return;
      }

      // Create bracket matchups
      const activePlayers = state.currentGame.players.filter(p => !p.eliminated);
      const matchups = [];
      
      for (let i = 0; i < activePlayers.length; i += 2) {
        if (i + 1 < activePlayers.length) {
          matchups.push({
            player1: activePlayers[i].name,
            player2: activePlayers[i + 1].name,
            winner: null
          });
        } else {
          // Odd player gets a bye
          matchups.push({
            player1: activePlayers[i].name,
            player2: null,
            winner: activePlayers[i].name
          });
        }
      }

      state.currentGame.matchups = matchups;
      state.currentGame.currentMatchIndex = 0;
      state.currentGame.round = (state.currentGame.round || 0) + 1;
      state.currentGame.status = 'playing';
      
      const matchupText = matchups.filter(m => m.player2).map(m => 
        `${m.player1} vs ${m.player2}`
      ).join(' • ');

      state.currentGame.announcement = `ROUND ${state.currentGame.round} - ${matchupText}`;
      saveGameCloud(state.currentGame);
      
      state.announcement = state.currentGame.announcement;
      renderStatic();
      
      await new Promise(r => setTimeout(r, 5000));
      
      state.announcement = '';
      state.currentGame.announcement = '';
      saveGameCloud(state.currentGame);
      renderStatic();
      
      for (let i = 3; i > 0; i--) {
        state.countdown = i;
        renderStatic();
        await new Promise(r => setTimeout(r, 1000));
      }
      
      state.countdown = 0;
      
      // Start the first matchup
      startMatchup(0);
    }

    function startMatchup(matchupIndex) {
      const matchup = state.currentGame.matchups[matchupIndex];
      
      // If it's a bye, skip to next matchup
      if (!matchup.player2) {
        state.currentGame.currentMatchIndex++;
        if (state.currentGame.currentMatchIndex < state.currentGame.matchups.length) {
          startMatchup(state.currentGame.currentMatchIndex);
        } else {
          endRound();
        }
        return;
      }
      
      state.currentGame.currentMatchup = matchup;
      state.currentGame.matchupAnswers = {};
      saveGameCloud(state.currentGame);
      
      startQuestion();
    }

    async function checkMatchupResult() {
      const matchup = state.currentGame.currentMatchup;
      const answers = state.currentGame.matchupAnswers;
      
      const p1Answer = answers[matchup.player1];
      const p2Answer = answers[matchup.player2];
      
      // Both players must have answered
      if (!p1Answer || !p2Answer) {
        return;
      }
      
      const p1Correct = p1Answer.isCorrect;
      const p2Correct = p2Answer.isCorrect;
      
      // If both wrong, show result and play another question!
      if (!p1Correct && !p2Correct) {
        state.currentGame.matchupResult = {
          bothWrong: true,
          p1: { name: matchup.player1, ...p1Answer },
          p2: { name: matchup.player2, ...p2Answer }
        };
        
        saveGameCloud(state.currentGame);
        
        // Show both wrong result
        state.view = 'matchupResult';
        renderStatic();
        
        await new Promise(r => setTimeout(r, 3000));
        
        // Clear result and reset for new question
        state.currentGame.matchupResult = null;
        state.currentGame.matchupAnswers = {};
        state.currentQuestion = null;
        saveGameCloud(state.currentGame);
        
        // Play another question!
        startQuestion();
        return;
      }
      
      let winner = null;
      let loser = null;
      
      if (p1Correct && !p2Correct) {
        winner = matchup.player1;
        loser = matchup.player2;
      } else if (p2Correct && !p1Correct) {
        winner = matchup.player2;
        loser = matchup.player1;
      } else if (p1Correct && p2Correct) {
        // Both correct - faster player wins!
        if (p1Answer.answerTime < p2Answer.answerTime) {
          winner = matchup.player1;
          loser = matchup.player2;
        } else {
          winner = matchup.player2;
          loser = matchup.player1;
        }
      }
      
      // Update matchup
      matchup.winner = winner;
      
      // Eliminate loser
      const loserPlayer = state.currentGame.players.find(p => p.name === loser);
      if (loserPlayer) {
        loserPlayer.eliminated = true;
      }
      
      // Give winner a win
      const winnerPlayer = state.currentGame.players.find(p => p.name === winner);
      if (winnerPlayer) {
        winnerPlayer.wins++;
      }
      
      state.currentGame.matchupResult = {
        winner,
        loser,
        bothWrong: false,
        p1: { name: matchup.player1, ...p1Answer },
        p2: { name: matchup.player2, ...p2Answer }
      };
      
      saveGameCloud(state.currentGame);
      
      // Show matchup result
      state.view = 'matchupResult';
      renderStatic();
      
      await new Promise(r => setTimeout(r, 4000));
      
      // Move to next matchup
      state.currentGame.currentMatchIndex++;
      state.currentGame.matchupResult = null;
      
      if (state.currentGame.currentMatchIndex < state.currentGame.matchups.length) {
        startMatchup(state.currentGame.currentMatchIndex);
      } else {
        endRound();
      }
    }

    async function endRound() {
      // Check if we should show podium or start next round
      const winners = state.currentGame.matchups.map(m => m.winner).filter(Boolean);
      
      if (winners.length === 1) {
        // We have a champion!
        showPodium();
      } else if (winners.length <= 3) {
        // Final few - show podium
        showPodium();
      } else {
        // Create next round
        state.view = 'lobby';
        state.currentGame.status = 'lobby';
        state.currentGame.currentMatchup = null;
        state.currentGame.matchups = null;
        state.currentQuestion = null;
        saveGameCloud(state.currentGame);
        renderStatic();
      }
    }

    function startQuestionTimer() {
      if (questionTimer) {
        clearInterval(questionTimer);
      }
      
      questionTimer = setInterval(() => {
        if (!state.isFrozen) {
          state.timeLeft--;
          updateTimerDisplay();
          
          if (state.timeLeft <= 0) {
            clearInterval(questionTimer);
            questionTimer = null;
            if (!state.hasAnswered) {
              showError('Time\'s up!');
              setTimeout(() => {
                showResults();
              }, 2000);
            }
          }
        }
      }, 1000);
    }

    function startQuestion() {
      state.view = 'playing';
      state.hasAnswered = false;
      state.selectedAnswer = null;
      state.timeLeft = 15;
      state.answerTime = null;
      
      const question = getRandomQuestion(state.currentGame.theme);
      state.currentQuestion = question;
      
      state.currentGame.currentQuestion = question;
      state.currentGame.timestamp = Date.now();
      questionStartTime = Date.now(); // Track when question started
      saveGameCloud(state.currentGame);
      
      renderStatic();
      startQuestionTimer();
    }

    function updateTimerDisplay() {
      const timerText = document.getElementById('timer-text');
      const timerProgress = document.getElementById('timer-progress');
      
      if (timerText) {
        timerText.textContent = state.timeLeft;
      }
      
      if (timerProgress) {
        const progress = (state.timeLeft / 15) * 283; // 283 is circumference
        timerProgress.style.strokeDashoffset = 283 - progress;
        
        if (state.timeLeft <= 5) {
          timerProgress.classList.add('danger');
          timerProgress.classList.remove('warning');
        } else if (state.timeLeft <= 10) {
          timerProgress.classList.add('warning');
          timerProgress.classList.remove('danger');
        } else {
          timerProgress.classList.remove('warning', 'danger');
        }
      }
    }

    function answerQuestion(answerIndex) {
      if (state.hasAnswered || state.isFrozen) return;
      
      // Calculate answer time in milliseconds
      const answerTime = Date.now() - questionStartTime;
      state.answerTime = answerTime;
      
      // Stop the timer immediately
      if (questionTimer) {
        clearInterval(questionTimer);
        questionTimer = null;
      }
      
      state.hasAnswered = true;
      state.selectedAnswer = answerIndex;
      
      const isCorrect = answerIndex === state.currentQuestion.correct;
      const myPlayer = state.currentGame.players.find(p => p.name === state.playerName);
      
      if (state.currentGame.isPowerupMode) {
        // Powerup earning mode (unchanged)
        if (isCorrect) {
          const powerupTypes = ['freeze', 'shield', 'double', 'fireball', 'switch', 'star'];
          const randomPowerup = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
          myPlayer.powerups[randomPowerup]++;
          
          const powerupNames = { 
            freeze: '❄️ Ice Freeze', 
            shield: '🛡️ Shield', 
            double: '✌️ Double Points',
            fireball: '🔥 Fireball',
            switch: '🔄 Switch',
            star: '⭐ Battlestar'
          };
          showSuccess(`Correct! ✅ Earned ${powerupNames[randomPowerup]}!`);
          
          state.currentGame.powerupQuestionCount++;
          
          if (state.currentGame.powerupQuestionCount >= 3) {
            state.currentGame.isPowerupMode = false;
            state.currentGame.powerupQuestionCount = 0;
            saveGameCloud(state.currentGame);
            
            setTimeout(() => {
              state.view = 'lobby';
              state.currentGame.status = 'lobby';
              state.currentQuestion = null;
              renderStatic();
            }, 2000);
          } else {
            saveGameCloud(state.currentGame);
            setTimeout(() => {
              startQuestion();
            }, 2000);
          }
        } else {
          showError('Wrong! ❌ No powerup earned.');
          
          state.currentGame.powerupQuestionCount++;
          
          if (state.currentGame.powerupQuestionCount >= 3) {
            state.currentGame.isPowerupMode = false;
            state.currentGame.powerupQuestionCount = 0;
            saveGameCloud(state.currentGame);
            
            setTimeout(() => {
              state.view = 'lobby';
              state.currentGame.status = 'lobby';
              state.currentQuestion = null;
              renderStatic();
            }, 2000);
          } else {
            saveGameCloud(state.currentGame);
            setTimeout(() => {
              startQuestion();
            }, 2000);
          }
        }
      } else if (state.currentGame.isBracketRound) {
        // Bracket round mode (unchanged)
        if (isCorrect) {
          state.currentGame.bracketScores[state.playerName]++;
          showSuccess('Correct! ✅ Point scored!');
        } else {
          showError('Wrong! ❌ No point.');
        }
        
        saveGameCloud(state.currentGame);
        renderStatic();
        
        if (!state.currentGame.bracketQuestionCount) {
          state.currentGame.bracketQuestionCount = 0;
        }
        state.currentGame.bracketQuestionCount++;
        
        if (state.currentGame.bracketQuestionCount >= 5) {
          setTimeout(() => {
            endBracketRound();
          }, 2000);
        } else {
          saveGameCloud(state.currentGame);
          setTimeout(() => {
            startQuestion();
          }, 2000);
        }
      } else if (state.currentGame.currentMatchup) {
        // Tournament matchup mode - NEW!
        if (!state.currentGame.matchupAnswers) {
          state.currentGame.matchupAnswers = {};
        }
        
        state.currentGame.matchupAnswers[state.playerName] = {
          answerIndex,
          isCorrect,
          answerTime,
          timeRemaining: state.timeLeft
        };
        
        saveGameCloud(state.currentGame);
        
        if (isCorrect) {
          showSuccess(`Correct! ✅ (${(answerTime / 1000).toFixed(2)}s)`);
        } else {
          showError(`Wrong! ❌ (${(answerTime / 1000).toFixed(2)}s)`);
        }
        
        renderStatic();
        
        // Check if both players in matchup have answered
        const matchup = state.currentGame.currentMatchup;
        const answers = state.currentGame.matchupAnswers;
        
        if (answers[matchup.player1] && answers[matchup.player2]) {
          setTimeout(() => {
            checkMatchupResult();
          }, 2000);
        }
      } else {
        // Old single elimination mode - fallback
        if (isCorrect) {
          const pointsToAdd = myPlayer.doublePoints ? 2 : 1;
          myPlayer.wins += pointsToAdd;
          myPlayer.doublePoints = false;
          
          showSuccess(pointsToAdd === 2 ? 'Correct! ✅✅ Double Points!' : 'Correct! ✅');
          saveGameCloud(state.currentGame);
        } else {
          if (myPlayer.hasShield) {
            myPlayer.hasShield = false;
            showSuccess('Wrong but Shield protected you! 🛡️');
          } else {
            myPlayer.losses++;
            
            if (myPlayer.losses >= 1) {
              myPlayer.eliminated = true;
              showError('Wrong! ❌ ELIMINATED!');
            }
          }
          saveGameCloud(state.currentGame);
        }
        
        renderStatic();
        
        setTimeout(() => {
          if (checkForPodium()) {
            showPodium();
          } else {
            showResults();
          }
        }, 2000);
      }
    }

    async function showResults() {
      // Make sure timer is cleared
      if (questionTimer) {
        clearInterval(questionTimer);
        questionTimer = null;
      }
      
      state.view = 'results';
      renderStatic();
      
      setTimeout(() => {
        // Reset question state
        state.currentQuestion = null;
        state.selectedAnswer = null;
        state.hasAnswered = false;
        state.timeLeft = 0;
        
        // Go back to lobby
        state.view = 'lobby';
        state.currentGame.status = 'lobby';
        state.currentGame.currentQuestion = null;
        state.currentGame.timestamp = Date.now();
        saveGameCloud(state.currentGame);
        renderStatic();
      }, 3000);
    }

              ` : ''}
            </div>
            
            ${ranked.length > 3 ? `
            <div style="margin-top:3rem">
              <h3 class="title" style="font-size:1.5rem;margin-bottom:1rem">Other Players:</h3>
              <div style="display:flex;flex-direction:column;gap:0.5rem;max-width:400px;margin:0 auto">
                ${ranked.slice(3).map((p, i) => `
                  <div style="background:rgba(15,23,42,0.5);border:2px solid rgba(168,85,247,0.5);border-radius:0.5rem;padding:1rem;display:flex;justify-content:space-between">
                    <span style="font-weight:600">${i + 4}. ${p.name}</span>
                    <span style="color:#fbbf24">${p.wins} 🏆</span>
                  </div>
                `).join('')}
              </div>
            </div>
            ` : ''}
            
            <button onclick="location.reload()" class="btn-purple title" style="margin-top:3rem;padding:1rem 2rem;font-size:1.25rem">
              🎮 Play Again
            </button>
          </div>
        `;
      }

      html += `
        <div class="status-indicator" onclick="this.style.display='none'" title="Click to dismiss">
          <div style="color:#4ade80">✅ Online & Connected!</div>
          <div style="color:#9ca3af">Cross-device enabled • Click to hide</div>
        </div>
      `;
      
      // Add persistent powerup button (only in special mode and when player has game)
      if (state.currentGame && state.currentGame.mode === 'special' && state.playerName && 
          (state.view === 'lobby' || state.view === 'playing' || state.view === 'results' || state.view === 'matchupResult')) {
        const myPlayer = state.currentGame.players.find(p => p.name === state.playerName);
        const totalPowerups = myPlayer ? Object.values(myPlayer.powerups).reduce((sum, count) => sum + count, 0) : 0;
        
        html += `
          <button 
            onclick="togglePowerupMenu()" 
            ${totalPowerups === 0 || state.isFrozen ? 'disabled' : ''}
            style="position:fixed;bottom:1rem;left:1rem;background:linear-gradient(to right, #9333ea, #6b21a8);border:2px solid rgba(168,85,247,0.5);color:white;padding:1rem 1.5rem;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer;z-index:60;box-shadow:0 10px 40px rgba(168,85,247,0.4);transition:all 0.3s;${totalPowerups === 0 ? 'opacity:0.5;' : ''}"
            onmouseover="if(!this.disabled) this.style.transform='scale(1.1)'"
            onmouseout="this.style.transform='scale(1)'"
          >
            ⚡ Use Powerups (${totalPowerups})
          </button>
        `;
      }
      
      // Add powerup menu overlay
      if (state.showPowerupMenu && state.currentGame && state.playerName) {
        const myPlayer = state.currentGame.players.find(p => p.name === state.playerName);
        if (myPlayer) {
          const powerupData = [
            { key: 'freeze', icon: '❄️', name: 'Ice Freeze', desc: 'Freeze all opponents for 3 seconds', color: '#60a5fa' },
            { key: 'shield', icon: '🛡️', name: 'Shield', desc: 'Protect from next elimination', color: '#34d399' },
            { key: 'double', icon: '✌️', name: 'Double Points', desc: 'Next win counts twice', color: '#fbbf24' },
            { key: 'fireball', icon: '🔥', name: 'Fireball', desc: 'Destroy opponent\'s powerup', color: '#ef4444' },
            { key: 'switch', icon: '🔄', name: 'Switch', desc: 'Swap scores with opponent', color: '#a78bfa' },
            { key: 'star', icon: '⭐', name: 'Battlestar', desc: 'Bracket round - Top half advances', color: '#fde047' }
          ];
          
          html += `
            <div class="overlay" style="z-index:200" onclick="togglePowerupMenu()">
              <div onclick="event.stopPropagation()" style="background:rgba(15,23,42,0.95);border:2px solid rgba(168,85,247,0.5);border-radius:1rem;padding:2rem;max-width:600px;width:90%;max-height:80vh;overflow-y:auto">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem">
                  <h2 class="title" style="font-size:2rem">⚡ Use Powerups</h2>
                  <button onclick="togglePowerupMenu()" style="background:transparent;border:none;color:#9ca3af;font-size:2rem;cursor:pointer;padding:0.5rem">×</button>
                </div>
                
                <div style="display:grid;gap:1rem">
                  ${powerupData.map(p => {
                    const count = myPlayer.powerups[p.key] || 0;
                    const canUse = count > 0 && !state.isFrozen;
                    
                    return `
                      <button 
                        onclick="${canUse ? `usePowerup('${p.key}'); togglePowerupMenu()` : ''}" 
                        ${!canUse ? 'disabled' : ''}
                        style="background:${canUse ? 'rgba(88,28,135,0.3)' : 'rgba(30,41,59,0.3)'};border:2px solid ${canUse ? 'rgba(168,85,247,0.5)' : '#334155'};border-radius:0.75rem;padding:1.5rem;text-align:left;cursor:${canUse ? 'pointer' : 'not-allowed'};transition:all 0.3s;opacity:${canUse ? '1' : '0.5'}"
                        ${canUse ? `onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 10px 40px rgba(168,85,247,0.4)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='none'"` : ''}
                      >
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
                          <div style="display:flex;align-items:center;gap:1rem">
                            <span style="font-size:2.5rem">${p.icon}</span>
                            <div>
                              <div style="font-size:1.25rem;font-weight:700;color:${p.color}">${p.name}</div>
                              <div style="font-size:0.875rem;color:#9ca3af;margin-top:0.25rem">${p.desc}</div>
                            </div>
                          </div>
                          <div style="background:rgba(0,0,0,0.3);border-radius:999px;padding:0.5rem 1rem;font-size:1.5rem;font-weight:900;color:${p.color}">
                            ${count}
                          </div>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
                
                ${myPlayer.hasShield ? '<div style="background:rgba(34,197,94,0.2);border:2px solid #22c55e;border-radius:0.5rem;padding:1rem;margin-top:1.5rem;text-align:center"><div style="font-size:1rem;color:#22c55e;font-weight:700">🛡️ Shield Active - Protected from elimination!</div></div>' : ''}
                ${myPlayer.doublePoints ? '<div style="background:rgba(251,191,36,0.2);border:2px solid #fbbf24;border-radius:0.5rem;padding:1rem;margin-top:1.5rem;text-align:center"><div style="font-size:1rem;color:#fbbf24;font-weight:700">✌️ Double Points Active - Next win counts twice!</div></div>' : ''}
              </div>
            </div>
          `;
        }
      }

      app.innerHTML = html;
      
      // Update timer display if on playing view
      if (state.view === 'playing' && state.currentQuestion) {
        updateTimerDisplay();
      }
      } catch (error) {
        // Silently handle render errors
      }
    }

    renderStatic();
  </script>
</body>
</html>
